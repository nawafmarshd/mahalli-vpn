name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Unpack project
        run: |
          unzip -q -o mahalli.zip -d proj
          ls proj

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"

      - name: Create signing key
        run: |
          mkdir -p ~/.android
          [ -f ~/.android/debug.keystore ] || keytool -genkey -v \
            -keystore ~/.android/debug.keystore -alias androiddebugkey \
            -storepass android -keypass android -keyalg RSA -keysize 2048 \
            -validity 10000 -dname "CN=Android Debug,O=Android,C=US"

      - name: Build
        working-directory: proj
        run: gradle assembleRelease --no-daemon

      - name: APK size
        run: ls -l proj/app/build/outputs/apk/release/*.apk

      - uses: actions/upload-artifact@v4
        with:
          name: Mahalli-APK
          path: proj/app/build/outputs/apk/release/*.apk
